[pytest]
# Both suites, so a bare `pytest` at the root runs everything CI runs. The
# per-skill suite covers `plan-tasks`, `wdd-finish` and `project-config`; when
# it was omitted here, 93 of 258 tests never ran in CI and a change to any of
# those scripts could have merged green.
testpaths = tests skills/wave-driven-development/tests
